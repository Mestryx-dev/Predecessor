name: Docker publish

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public (Dokploy pull without registry login)
        continue-on-error: true
        run: |
          for endpoint in \
            "/orgs/Mestryx-dev/packages/container/predecessor/visibility" \
            "/user/packages/container/predecessor/visibility"; do
            if gh api --method POST "$endpoint" -f visibility=public; then
              echo "Package set public via $endpoint"
              exit 0
            fi
          done
          echo "::warning::Could not set GHCR visibility via API — set public manually in GitHub Packages UI"
          exit 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
